# #2 pinned Foundry config — reproducible bytecode for the deterministic state
# hash (#19) across CI (#3) and Fuji (#13). OZ v5 _update hook target.
[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/",
    "forge-std/=lib/forge-std/src/",
]

# #2 >=256 fuzz/invariant runs wired here; the property tests ship in #11/#19.
[fuzz]
runs = 256

[invariant]
runs = 256
depth = 64

# #2 [fmt] pinned so `forge fmt --check` is deterministic in CI (#3) and the
# pre-commit hook (#4) — identical settings on both sides.
[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
