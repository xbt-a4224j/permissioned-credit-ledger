# warehouse — the origination data-platform sidecar (#51). Fixed port 47100 (see CLAUDE.md ports).
spring.application.name=warehouse
server.port=47100

# actuator: a liveness/health endpoint at /actuator/health for dev + CI smoke checks.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# shared Postgres instance with the TS stack (#74 owns the wh_* tables). Overridable via env.
# datasource is lazily used — the app boots without a DB so the scaffold (#51) stands alone.
spring.datasource.url=${WAREHOUSE_DB_URL:jdbc:postgresql://localhost:55432/pcl}
spring.datasource.username=${WAREHOUSE_DB_USER:postgres}
spring.datasource.password=${WAREHOUSE_DB_PASSWORD:postgres}

# #74 raw-SQL migrations of the wh_* tables via Boot's built-in SQL init (no ORM, no Flyway). The
# DDL is idempotent (create table if not exists), so running it on every boot is safe; mode=always
# because Postgres is non-embedded (default would skip it). Coexists with the TS public schema.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/migration/V1__wh_core.sql
spring.sql.init.continue-on-error=false

# #55 transparent score weights (relative; the composite divides by their sum). Tunable here so the
# ranking's emphasis is config, not code. credit quality leads, then return, then duration + fit.
warehouse.score.credit=0.35
warehouse.score.ret=0.25
warehouse.score.duration=0.20
warehouse.score.portfolio=0.20
