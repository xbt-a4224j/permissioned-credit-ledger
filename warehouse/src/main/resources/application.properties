# warehouse — the origination data-platform sidecar (#51). Fixed port 47100 (see CLAUDE.md ports).
spring.application.name=warehouse
server.port=47100

# actuator: a liveness/health endpoint at /actuator/health for dev + CI smoke checks.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# shared Postgres instance with the TS stack (#74 owns the wh_* tables). Overridable via env.
# datasource is lazily used — the app boots without a DB so the scaffold (#51) stands alone.
spring.datasource.url=${WAREHOUSE_DB_URL:jdbc:postgresql://localhost:55432/pcl}
spring.datasource.username=${WAREHOUSE_DB_USER:postgres}
spring.datasource.password=${WAREHOUSE_DB_PASSWORD:postgres}
spring.sql.init.mode=never
