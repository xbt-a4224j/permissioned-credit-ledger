# #4 lint every commit in a PR against the conventional-commit grammar (#3's
# fmt gate covers formatting; this covers commit messages).
name: Commitlint

on: pull_request

permissions:
  contents: read

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - name: bun install --frozen-lockfile
        run: bun install --frozen-lockfile
      - name: Lint PR commits
        run: bun x commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose
