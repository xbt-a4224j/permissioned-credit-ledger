<svg viewBox="0 0 960 640" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 Z" fill="#222"/></marker>
    <marker id="ao" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 Z" fill="#d2691e"/></marker>
  </defs>
  <text x="32" y="40" font-size="20" font-weight="700" fill="#1a1d24">transfer lifecycle — invest → accrue → claim (runtime sequence)</text>
  <text x="32" y="60" font-size="12.5" fill="#5a6472">One holder's path through the system: an invest tx clears the gauntlet, accrual runs on-chain, the indexer projects it, then claim pays from the reserve under the recon gate.</text>

  <!-- lifelines / lane headers -->
  <text x="92"  y="100" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" font-size="12" font-weight="700" fill="#2563eb">web (UI)</text>
  <text x="290" y="100" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" font-size="12" font-weight="700" fill="#15803d">api / signer</text>
  <text x="500" y="100" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" font-size="12" font-weight="700" fill="#c0392b">CreditToken (chain)</text>
  <text x="700" y="100" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" font-size="12" font-weight="700" fill="#b08900">indexer</text>
  <text x="868" y="100" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" font-size="12" font-weight="700" fill="#6d28d9">recon + DB</text>
  <line x1="92"  y1="110" x2="92"  y2="588" stroke="#2563eb" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="290" y1="110" x2="290" y2="588" stroke="#15803d" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="500" y1="110" x2="500" y2="588" stroke="#c0392b" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="700" y1="110" x2="700" y2="588" stroke="#b08900" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="868" y1="110" x2="868" y2="588" stroke="#6d28d9" stroke-width="1" stroke-dasharray="3 4"/>

  <!-- 1. invest -->
  <text x="32" y="134" font-size="10.5" font-weight="700" fill="#2563eb">INVEST</text>
  <line x1="92" y1="146" x2="290" y2="146" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="191" y="140" text-anchor="middle" font-size="10" fill="#5a6472">invest(loan, amount)</text>
  <line x1="290" y1="170" x2="500" y2="170" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="395" y="164" text-anchor="middle" font-size="10" fill="#5a6472">signed mint tx → _update()</text>

  <!-- gauntlet box on chain lane -->
  <g>
    <rect x="404" y="184" width="192" height="74" rx="8" fill="#f1ecfd" stroke="#6d28d9" stroke-width="2"/>
    <text x="500" y="206" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" font-size="11" font-weight="700" fill="#1a1d24">gauntlet (#8)</text>
    <text x="500" y="223" text-anchor="middle" font-size="9.5" fill="#5a6472">freeze → verified → compliance</text>
    <text x="500" y="238" text-anchor="middle" font-size="9.5" fill="#c0392b">fail → typed revert (5 codes)</text>
    <text x="500" y="252" text-anchor="middle" font-size="9.5" fill="#15803d">pass → mint + PositionOpened</text>
  </g>
  <!-- revert path back to UI -->
  <line x1="404" y1="244" x2="92" y2="280" stroke="#d2691e" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ao)"/>
  <text x="150" y="272" font-size="10" fill="#d2691e">revert → reason-code badge in UI</text>

  <!-- 2. accrue -->
  <text x="32" y="318" font-size="10.5" font-weight="700" fill="#c0392b">ACCRUE</text>
  <g>
    <rect x="404" y="296" width="192" height="56" rx="8" fill="#fbe9e7" stroke="#c0392b" stroke-width="2"/>
    <text x="500" y="318" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" font-size="11" font-weight="700" fill="#1a1d24">accrual (#9)</text>
    <text x="500" y="334" text-anchor="middle" font-size="9.5" fill="#5a6472">per-holder interest accrues</text>
    <text x="500" y="348" text-anchor="middle" font-size="9.5" fill="#5a6472">frozen if NAV anomalous (#17)</text>
  </g>
  <!-- events -> indexer -->
  <line x1="596" y1="324" x2="700" y2="324" stroke="#d2691e" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#ao)"/>
  <text x="648" y="318" text-anchor="middle" font-size="10" fill="#d2691e">emit events</text>
  <!-- indexer -> db -->
  <line x1="700" y1="356" x2="868" y2="356" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="784" y="350" text-anchor="middle" font-size="10" fill="#5a6472">project (idempotent</text>
  <text x="784" y="372" text-anchor="middle" font-size="9.5" fill="#5a6472">by blockNumber,logIndex)</text>
  <!-- db -> ui via sse -->
  <line x1="868" y1="392" x2="92" y2="408" stroke="#d2691e" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ao)"/>
  <text x="430" y="402" text-anchor="middle" font-size="10" fill="#d2691e">SSE live feed → accrual ticker in UI</text>

  <!-- 3. claim -->
  <text x="32" y="450" font-size="10.5" font-weight="700" fill="#2563eb">CLAIM</text>
  <line x1="92" y1="462" x2="290" y2="462" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="191" y="456" text-anchor="middle" font-size="10" fill="#5a6472">claim(loan)</text>
  <!-- recon gate check -->
  <line x1="290" y1="486" x2="868" y2="486" stroke="#222" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="560" y="480" text-anchor="middle" font-size="10" fill="#5a6472">assertCanDistribute() — is the latest recon cycle OK?</text>
  <g>
    <rect x="772" y="498" width="180" height="58" rx="8" fill="#f1ecfd" stroke="#6d28d9" stroke-width="2"/>
    <text x="862" y="520" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" font-size="11" font-weight="700" fill="#1a1d24">recon gate (#18)</text>
    <text x="862" y="536" text-anchor="middle" font-size="9.5" fill="#c0392b">halted → DistributionHalted</text>
    <text x="862" y="550" text-anchor="middle" font-size="9.5" fill="#15803d">clean → proceed</text>
  </g>
  <!-- claim tx to chain -->
  <line x1="290" y1="530" x2="500" y2="530" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="395" y="524" text-anchor="middle" font-size="10" fill="#5a6472">if clean: signed claim tx</text>
  <g>
    <rect x="404" y="544" width="192" height="40" rx="8" fill="#fbe9e7" stroke="#c0392b" stroke-width="2"/>
    <text x="500" y="562" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" font-size="10.5" font-weight="700" fill="#1a1d24">claim() — CEI (#9)</text>
    <text x="500" y="577" text-anchor="middle" font-size="9" fill="#5a6472">reset accrued · debit reserve · InterestClaimed (or InsufficientReserve)</text>
  </g>

  <!-- legend -->
  <g transform="translate(32,612)" font-size="10.5" fill="#5a6472">
    <rect x="0" y="-9" width="13" height="11" rx="2" fill="#eef4ff" stroke="#2563eb"/><text x="18" y="0">client</text>
    <rect x="70" y="-9" width="13" height="11" rx="2" fill="#ecf7ef" stroke="#15803d"/><text x="88" y="0">api</text>
    <rect x="128" y="-9" width="13" height="11" rx="2" fill="#fbf3da" stroke="#b08900"/><text x="146" y="0">indexer</text>
    <rect x="200" y="-9" width="13" height="11" rx="2" fill="#f1ecfd" stroke="#6d28d9"/><text x="218" y="0">engine/gate</text>
    <rect x="296" y="-9" width="13" height="11" rx="2" fill="#fbe9e7" stroke="#c0392b"/><text x="314" y="0">on-chain</text>
    <line x1="384" y1="-4" x2="410" y2="-4" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/><text x="416" y="0">request/call</text>
    <line x1="506" y1="-4" x2="532" y2="-4" stroke="#d2691e" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ao)"/><text x="538" y="0">event/async</text>
  </g>
</svg>
