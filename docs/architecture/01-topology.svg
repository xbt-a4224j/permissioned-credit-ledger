<svg viewBox="0 0 960 640" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 Z" fill="#222"/></marker>
    <marker id="ao" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 Z" fill="#d2691e"/></marker>
  </defs>
  <text x="32" y="40" font-size="20" font-weight="700" fill="#1a1d24">permissioned-credit-ledger — component topology</text>
  <text x="32" y="60" font-size="12.5" fill="#5a6472">A permissioned token on Avalanche, a viem indexer, a reconciliation engine, and a typed GraphQL API behind a institutional UI.</text>

  <!-- CLIENT band -->
  <text x="32" y="96" font-size="11" font-weight="700" fill="#2563eb" letter-spacing="0.08em">CLIENT</text>
  <g>
    <rect x="32" y="104" width="280" height="62" rx="8" fill="#eef4ff" stroke="#2563eb" stroke-width="2"/>
    <text x="172" y="130" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" font-size="13" font-weight="600" fill="#1a1d24">web (React + Vite)</text>
    <text x="172" y="148" text-anchor="middle" font-size="10.5" fill="#5a6472">marketplace · dashboard · invest/claim · recon panel</text>
  </g>

  <!-- OFF-CHAIN band -->
  <text x="32" y="206" font-size="11" font-weight="700" fill="#15803d" letter-spacing="0.08em">OFF-CHAIN  (TypeScript on Bun)</text>
  <g>
    <rect x="32" y="216" width="190" height="60" rx="8" fill="#ecf7ef" stroke="#15803d" stroke-width="2"/>
    <text x="127" y="241" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" font-size="13" font-weight="600" fill="#1a1d24">api (Pothos GraphQL)</text>
    <text x="127" y="259" text-anchor="middle" font-size="10.5" fill="#5a6472">queries · mutations · SSE</text>
  </g>
  <g>
    <rect x="252" y="216" width="150" height="60" rx="8" fill="#fbf3da" stroke="#b08900" stroke-width="2"/>
    <text x="327" y="241" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" font-size="13" font-weight="600" fill="#1a1d24">indexer (viem)</text>
    <text x="327" y="259" text-anchor="middle" font-size="10.5" fill="#5a6472">reads chain events</text>
  </g>
  <g>
    <rect x="432" y="216" width="150" height="60" rx="8" fill="#f1ecfd" stroke="#6d28d9" stroke-width="2"/>
    <text x="507" y="241" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" font-size="13" font-weight="600" fill="#1a1d24">nav-gate</text>
    <text x="507" y="259" text-anchor="middle" font-size="10.5" fill="#5a6472">staleness · bounds · halt</text>
  </g>
  <!-- reconciliation engine -->
  <g>
    <rect x="612" y="210" width="316" height="72" rx="10" fill="#f1ecfd" stroke="#6d28d9" stroke-width="3"/>
    <text x="770" y="237" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" font-size="14" font-weight="700" fill="#1a1d24">reconciliation-engine  ★</text>
    <text x="770" y="256" text-anchor="middle" font-size="10.5" fill="#5a6472">4 invariants · HALT on mismatch · replay + stateHash</text>
    <text x="770" y="272" text-anchor="middle" font-size="10" fill="#6d28d9">the gate: off-chain cash == on-chain claimable, or stop</text>
  </g>
  <!-- Postgres -->
  <g>
    <rect x="252" y="330" width="200" height="60" rx="8" fill="#fbe9e7" stroke="#c0392b" stroke-width="2"/>
    <text x="352" y="355" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" font-size="13" font-weight="600" fill="#1a1d24">Postgres</text>
    <text x="352" y="373" text-anchor="middle" font-size="10.5" fill="#5a6472">read models (positions · accrual · recon_status)</text>
  </g>

  <!-- ON-CHAIN container -->
  <rect x="32" y="450" width="896" height="150" rx="12" fill="#fdf5f4" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="48" y="474" font-size="11" font-weight="700" fill="#c0392b" letter-spacing="0.08em">ON-CHAIN — Avalanche C-Chain (Fuji testnet / local node)</text>
  <g>
    <rect x="48" y="486" width="200" height="58" rx="8" fill="#fbe9e7" stroke="#c0392b" stroke-width="2"/>
    <text x="148" y="510" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" font-size="12.5" font-weight="600" fill="#1a1d24">IdentityRegistry</text>
    <text x="148" y="527" text-anchor="middle" font-size="10" fill="#5a6472">claims · verified · jurisdiction</text>
  </g>
  <g>
    <rect x="268" y="486" width="200" height="58" rx="8" fill="#fbe9e7" stroke="#c0392b" stroke-width="2"/>
    <text x="368" y="510" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" font-size="12.5" font-weight="600" fill="#1a1d24">ComplianceRegistry</text>
    <text x="368" y="527" text-anchor="middle" font-size="10" fill="#5a6472">Reg D / Reg S rules</text>
  </g>
  <g>
    <rect x="488" y="478" width="240" height="74" rx="8" fill="#fbe9e7" stroke="#c0392b" stroke-width="2.5"/>
    <text x="608" y="503" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" font-size="13" font-weight="700" fill="#1a1d24">CreditToken (ERC-3643-lite)</text>
    <text x="608" y="521" text-anchor="middle" font-size="10" fill="#5a6472">permissioned transfer · mint/burn</text>
    <text x="608" y="537" text-anchor="middle" font-size="10" fill="#5a6472">per-holder accrual · claim() (CEI)</text>
  </g>
  <g>
    <rect x="748" y="486" width="160" height="58" rx="8" fill="#fbe9e7" stroke="#c0392b" stroke-width="2"/>
    <text x="828" y="510" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" font-size="12.5" font-weight="600" fill="#1a1d24">MockUSDC</text>
    <text x="828" y="527" text-anchor="middle" font-size="10" fill="#5a6472">reserve (cash leg)</text>
  </g>
  <!-- intra-chain edges -->
  <line x1="508" y1="515" x2="468" y2="515" stroke="#222" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="488" y1="530" x2="248" y2="528" stroke="#222" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="430" y="466" font-size="9.5" fill="#5a6472">canTransfer()</text>
  <line x1="728" y1="515" x2="748" y2="515" stroke="#222" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- cross-band edges -->
  <!-- web <-> api -->
  <line x1="160" y1="166" x2="135" y2="216" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="70" y="196" font-size="10" fill="#5a6472">GraphQL request</text>
  <line x1="150" y1="216" x2="175" y2="166" stroke="#d2691e" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ao)"/>
  <text x="200" y="196" font-size="10" fill="#d2691e">SSE live feed</text>
  <!-- api -> chain (tx) -->
  <line x1="127" y1="276" x2="140" y2="478" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="40" y="380" font-size="10" fill="#5a6472" transform="rotate(90 40 380)">tx: invest/transfer/claim</text>
  <!-- chain events -> indexer (orange) -->
  <line x1="600" y1="478" x2="340" y2="276" stroke="#d2691e" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#ao)"/>
  <text x="430" y="330" font-size="10" fill="#d2691e">emit events</text>
  <!-- indexer -> postgres -->
  <line x1="327" y1="276" x2="345" y2="330" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="348" y="306" font-size="10" fill="#5a6472">project</text>
  <!-- api reads postgres -->
  <line x1="250" y1="350" x2="222" y2="262" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="190" y="320" font-size="10" fill="#5a6472">read models</text>
  <!-- nav -> recon -->
  <line x1="582" y1="246" x2="612" y2="246" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/>
  <!-- recon reads postgres + chain -->
  <line x1="612" y1="262" x2="452" y2="356" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="470" y="300" font-size="10" fill="#5a6472">read claimable</text>
  <line x1="700" y1="282" x2="650" y2="478" stroke="#222" stroke-width="1.3" stroke-dasharray="3 3" marker-end="url(#a)"/>
  <text x="660" y="380" font-size="9.5" fill="#5a6472" transform="rotate(75 660 380)">read on-chain state</text>
  <!-- recon -> api (halt status, orange) -->
  <line x1="612" y1="252" x2="222" y2="248" stroke="#d2691e" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ao)"/>
  <text x="420" y="206" font-size="10" fill="#d2691e">HALT status → API → UI</text>

  <!-- legend -->
  <g transform="translate(32,612)" font-size="10.5" fill="#5a6472">
    <rect x="0" y="-9" width="13" height="11" rx="2" fill="#eef4ff" stroke="#2563eb"/><text x="18" y="0">client</text>
    <rect x="70" y="-9" width="13" height="11" rx="2" fill="#ecf7ef" stroke="#15803d"/><text x="88" y="0">api</text>
    <rect x="128" y="-9" width="13" height="11" rx="2" fill="#fbf3da" stroke="#b08900"/><text x="146" y="0">infra/libs</text>
    <rect x="212" y="-9" width="13" height="11" rx="2" fill="#f1ecfd" stroke="#6d28d9"/><text x="230" y="0">engine/core</text>
    <rect x="312" y="-9" width="13" height="11" rx="2" fill="#fbe9e7" stroke="#c0392b"/><text x="330" y="0">ground truth (chain/DB)</text>
    <line x1="490" y1="-4" x2="516" y2="-4" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/><text x="522" y="0">request/call</text>
    <line x1="612" y1="-4" x2="638" y2="-4" stroke="#d2691e" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ao)"/><text x="644" y="0">event/async</text>
  </g>
</svg>
