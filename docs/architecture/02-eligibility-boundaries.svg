<svg viewBox="0 0 960 640" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 Z" fill="#222"/></marker>
    <marker id="ao" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 Z" fill="#d2691e"/></marker>
  </defs>
  <text x="32" y="40" font-size="20" font-weight="700" fill="#1a1d24">eligibility &amp; trust boundaries — who can hold, who can transfer, who is trusted</text>
  <text x="32" y="60" font-size="12.5" fill="#5a6472">A wallet's tokens move only if it clears the transfer gauntlet: freeze check, then verified check, then compliance rules. The issuer role is the only trusted writer.</text>

  <!-- CLIENT band: actors -->
  <text x="32" y="96" font-size="11" font-weight="700" fill="#2563eb" letter-spacing="0.08em">ACTORS (wallets / roles)</text>
  <g>
    <rect x="32" y="104" width="170" height="92" rx="8" fill="#eef4ff" stroke="#2563eb" stroke-width="2"/>
    <text x="117" y="126" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" font-size="12.5" font-weight="600" fill="#1a1d24">holder wallets</text>
    <text x="117" y="146" text-anchor="middle" font-size="10" fill="#5a6472">accredited-US</text>
    <text x="117" y="161" text-anchor="middle" font-size="10" fill="#5a6472">RegS-nonUS</text>
    <text x="117" y="176" text-anchor="middle" font-size="10" fill="#5a6472">unverified · frozen</text>
    <text x="117" y="191" text-anchor="middle" font-size="9.5" fill="#5a6472">untrusted — gated</text>
  </g>
  <g>
    <rect x="220" y="104" width="170" height="92" rx="8" fill="#eef4ff" stroke="#2563eb" stroke-width="2.5"/>
    <text x="305" y="130" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" font-size="12.5" font-weight="700" fill="#1a1d24">issuer role</text>
    <text x="305" y="150" text-anchor="middle" font-size="10" fill="#5a6472">sole trusted writer</text>
    <text x="305" y="165" text-anchor="middle" font-size="10" fill="#5a6472">mint · burn · freeze</text>
    <text x="305" y="180" text-anchor="middle" font-size="10" fill="#5a6472">set claims · rules</text>
  </g>
  <g>
    <rect x="408" y="104" width="170" height="92" rx="8" fill="#ecf7ef" stroke="#15803d" stroke-width="2"/>
    <text x="493" y="130" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" font-size="12.5" font-weight="600" fill="#1a1d24">server signer</text>
    <text x="493" y="150" text-anchor="middle" font-size="10" fill="#5a6472">off-chain · seeded key</text>
    <text x="493" y="165" text-anchor="middle" font-size="10" fill="#5a6472">submits txs on behalf</text>
    <text x="493" y="180" text-anchor="middle" font-size="10" fill="#5a6472">of demo identities</text>
  </g>

  <!-- THE GAUNTLET container -->
  <rect x="32" y="240" width="896" height="232" rx="12" fill="#f1ecfd" stroke="#6d28d9" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="48" y="264" font-size="11" font-weight="700" fill="#6d28d9" letter-spacing="0.08em">THE TRANSFER GAUNTLET — CreditToken._update() (every mint / transfer / burn)</text>

  <!-- stage 1: freeze -->
  <g>
    <rect x="56" y="284" width="176" height="84" rx="8" fill="#fbe9e7" stroke="#c0392b" stroke-width="2"/>
    <text x="144" y="310" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" font-size="12" font-weight="700" fill="#1a1d24">1 · freeze check</text>
    <text x="144" y="330" text-anchor="middle" font-size="10" fill="#5a6472">IdentityRegistry.frozen</text>
    <text x="144" y="347" text-anchor="middle" font-size="10" fill="#5a6472">sender &amp; receiver</text>
    <text x="144" y="362" text-anchor="middle" font-size="9.5" fill="#c0392b">fail → ReceiverFrozen</text>
  </g>
  <!-- stage 2: verified -->
  <g>
    <rect x="276" y="284" width="176" height="84" rx="8" fill="#fbe9e7" stroke="#c0392b" stroke-width="2"/>
    <text x="364" y="310" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" font-size="12" font-weight="700" fill="#1a1d24">2 · verified check</text>
    <text x="364" y="330" text-anchor="middle" font-size="10" fill="#5a6472">IdentityRegistry.verified</text>
    <text x="364" y="347" text-anchor="middle" font-size="10" fill="#5a6472">receiver has identity</text>
    <text x="364" y="362" text-anchor="middle" font-size="9.5" fill="#c0392b">fail → ReceiverNotVerified</text>
  </g>
  <!-- stage 3: compliance -->
  <g>
    <rect x="496" y="284" width="200" height="84" rx="8" fill="#fbe9e7" stroke="#c0392b" stroke-width="2"/>
    <text x="596" y="310" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" font-size="12" font-weight="700" fill="#1a1d24">3 · compliance check</text>
    <text x="596" y="330" text-anchor="middle" font-size="10" fill="#5a6472">ComplianceRegistry.canTransfer</text>
    <text x="596" y="347" text-anchor="middle" font-size="10" fill="#5a6472">Reg D / Reg S · accreditation</text>
    <text x="596" y="362" text-anchor="middle" font-size="9.5" fill="#c0392b">fail → AccreditationRequired / NotEligible</text>
  </g>
  <!-- pass: mutate -->
  <g>
    <rect x="740" y="284" width="164" height="84" rx="8" fill="#ecf7ef" stroke="#15803d" stroke-width="2.5"/>
    <text x="822" y="312" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" font-size="12" font-weight="700" fill="#1a1d24">pass → mutate</text>
    <text x="822" y="332" text-anchor="middle" font-size="10" fill="#5a6472">balances updated</text>
    <text x="822" y="348" text-anchor="middle" font-size="10" fill="#5a6472">Transfer event</text>
    <text x="822" y="363" text-anchor="middle" font-size="10" fill="#5a6472">PositionOpened</text>
  </g>

  <!-- gauntlet stage edges -->
  <line x1="232" y1="326" x2="276" y2="326" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="452" y1="326" x2="496" y2="326" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="696" y1="326" x2="740" y2="326" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- the two registries it reads from -->
  <g>
    <rect x="56" y="392" width="396" height="64" rx="8" fill="#fdf5f4" stroke="#c0392b" stroke-width="1.5"/>
    <text x="254" y="416" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" font-size="12.5" font-weight="700" fill="#1a1d24">IdentityRegistry</text>
    <text x="254" y="434" text-anchor="middle" font-size="10" fill="#5a6472">verified · accredited · jurisdiction (US / RegS) · frozen</text>
    <text x="254" y="449" text-anchor="middle" font-size="9.5" fill="#5a6472">written only by the issuer role</text>
  </g>
  <g>
    <rect x="496" y="392" width="408" height="64" rx="8" fill="#fdf5f4" stroke="#c0392b" stroke-width="1.5"/>
    <text x="700" y="416" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" font-size="12.5" font-weight="700" fill="#1a1d24">ComplianceRegistry</text>
    <text x="700" y="434" text-anchor="middle" font-size="10" fill="#5a6472">Reg D (accredited-US) · Reg S (non-US) eligibility rules</text>
    <text x="700" y="449" text-anchor="middle" font-size="9.5" fill="#5a6472">consumer-law (TILA/RESPA) is a named-but-cut extension point</text>
  </g>
  <line x1="144" y1="368" x2="160" y2="392" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="364" y1="368" x2="300" y2="392" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="596" y1="368" x2="660" y2="392" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/>

  <!-- actor edges into gauntlet -->
  <line x1="117" y1="196" x2="130" y2="284" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="60" y="252" font-size="10" fill="#5a6472">transfer / invest</text>
  <line x1="305" y1="196" x2="320" y2="392" stroke="#d2691e" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ao)"/>
  <text x="330" y="280" font-size="10" fill="#d2691e">issuer writes claims</text>
  <line x1="493" y1="196" x2="200" y2="284" stroke="#222" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="380" y="240" font-size="10" fill="#5a6472">submits holder tx</text>

  <!-- legend -->
  <g transform="translate(32,612)" font-size="10.5" fill="#5a6472">
    <rect x="0" y="-9" width="13" height="11" rx="2" fill="#eef4ff" stroke="#2563eb"/><text x="18" y="0">actor / wallet</text>
    <rect x="100" y="-9" width="13" height="11" rx="2" fill="#ecf7ef" stroke="#15803d"/><text x="118" y="0">off-chain / pass</text>
    <rect x="222" y="-9" width="13" height="11" rx="2" fill="#f1ecfd" stroke="#6d28d9"/><text x="240" y="0">gauntlet (on-chain gate)</text>
    <rect x="392" y="-9" width="13" height="11" rx="2" fill="#fbe9e7" stroke="#c0392b"/><text x="410" y="0">registry / typed revert</text>
    <line x1="560" y1="-4" x2="586" y2="-4" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/><text x="592" y="0">request/call</text>
    <line x1="682" y1="-4" x2="708" y2="-4" stroke="#d2691e" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ao)"/><text x="714" y="0">issuer write</text>
  </g>
</svg>
