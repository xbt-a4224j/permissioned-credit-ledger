<svg viewBox="0 0 980 600" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#333"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1f7a5a"/></marker>
    <marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/></marker>
    <marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#b06a00"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>

  <text x="32" y="38" font-size="20" font-weight="700" fill="#1a1d24">Business architecture — who does what, and which component serves it</text>
  <text x="32" y="60" font-size="12.5" fill="#5a6472">A real loan's cash flows are pushed on-chain, wrapped in a permissioned token, and reconciled against the servicer's books before any payout.</text>

  <!-- ============ ACTORS (top band) ============ -->
  <!-- Borrower -->
  <rect x="32" y="92" width="170" height="70" rx="9" fill="#fdecec" stroke="#d23b3b" stroke-width="1.5"/>
  <text x="117" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1d24">Borrower</text>
  <text x="117" y="139" text-anchor="middle" font-size="11" fill="#5a6472">CRE sponsor; pays</text>
  <text x="117" y="153" text-anchor="middle" font-size="11" fill="#5a6472">interest on the loan</text>

  <!-- Originator / Servicer -->
  <rect x="252" y="92" width="200" height="70" rx="9" fill="#eef6f2" stroke="#1f7a5a" stroke-width="1.5"/>
  <text x="352" y="116" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1d24">Originator &amp; Servicer</text>
  <text x="352" y="135" text-anchor="middle" font-size="11" fill="#5a6472">writes &amp; services the loan;</text>
  <text x="352" y="149" text-anchor="middle" font-size="11" fill="#5a6472">reports NAV marks + cash collected</text>

  <!-- Investors -->
  <rect x="778" y="92" width="170" height="70" rx="9" fill="#eef4ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="863" y="116" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1d24">Investors</text>
  <text x="863" y="135" text-anchor="middle" font-size="11" fill="#5a6472">accredited (Reg D) +</text>
  <text x="863" y="149" text-anchor="middle" font-size="11" fill="#5a6472">non-US (Reg S); hold &amp; claim</text>

  <!-- borrower -> servicer -->
  <line x1="202" y1="127" x2="252" y2="127" stroke="#d23b3b" stroke-width="2" marker-end="url(#a)"/>
  <text x="227" y="118" text-anchor="middle" font-size="9.5" fill="#d23b3b">pays</text>

  <!-- ============ THE PLATFORM (this repo) ============ -->
  <rect x="32" y="188" width="916" height="316" rx="14" fill="#fbfbfe" stroke="#5b4bd6" stroke-width="2"/>
  <text x="48" y="212" font-size="12" font-weight="800" letter-spacing="0.06em" fill="#5b4bd6">TOKENIZATION PLATFORM &amp; ISSUER — this repository</text>

  <!-- servicer feed into platform -->
  <line x1="352" y1="162" x2="352" y2="232" stroke="#1f7a5a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ag)"/>
  <text x="360" y="182" font-size="10" fill="#1f7a5a">NAV + collected cash (off-chain feed)</text>

  <!-- investors invest/claim into platform -->
  <line x1="863" y1="162" x2="863" y2="232" stroke="#b06a00" stroke-width="2" marker-end="url(#ao)"/>
  <text x="757" y="182" font-size="10" fill="#b06a00">invest (USDC) / claim →</text>

  <!-- OFF-CHAIN band -->
  <text x="48" y="244" font-size="11" font-weight="700" fill="#15803d" letter-spacing="0.05em">OFF-CHAIN (TypeScript / Bun)</text>
  <rect x="48" y="252" width="180" height="58" rx="8" fill="#eef6f2" stroke="#1f7a5a" stroke-width="1.5"/>
  <text x="138" y="276" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a1d24">NAV feed + gate</text>
  <text x="138" y="294" text-anchor="middle" font-size="10" fill="#5a6472">bounds each mark</text>

  <rect x="240" y="252" width="180" height="58" rx="8" fill="#f1ecfd" stroke="#6d28d9" stroke-width="2.5"/>
  <text x="330" y="272" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1d24">Reconciliation engine ★</text>
  <text x="330" y="289" text-anchor="middle" font-size="9.5" fill="#6d28d9">4 invariants · HALT on mismatch</text>

  <rect x="432" y="252" width="150" height="58" rx="8" fill="#fbf3da" stroke="#b08900" stroke-width="1.5"/>
  <text x="507" y="276" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a1d24">Indexer (viem)</text>
  <text x="507" y="294" text-anchor="middle" font-size="10" fill="#5a6472">chain events → Postgres</text>

  <rect x="594" y="252" width="150" height="58" rx="8" fill="#ecf7ef" stroke="#15803d" stroke-width="1.5"/>
  <text x="669" y="276" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a1d24">GraphQL API</text>
  <text x="669" y="294" text-anchor="middle" font-size="10" fill="#5a6472">queries · SSE feed</text>

  <rect x="756" y="252" width="150" height="58" rx="8" fill="#eef4ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="831" y="276" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a1d24">Web UI</text>
  <text x="831" y="294" text-anchor="middle" font-size="10" fill="#5a6472">React · invest/claim</text>

  <!-- the seam label -->
  <text x="490" y="338" text-anchor="middle" font-size="11.5" font-weight="700" fill="#d23b3b">THE SEAM: off-chain servicing cash, proven equal to on-chain claimable every cycle — or distribution HALTS</text>
  <line x1="138" y1="346" x2="138" y2="392" stroke="#333" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="330" y1="310" x2="330" y2="392" stroke="#6d28d9" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="507" y1="310" x2="430" y2="392" stroke="#333" stroke-width="1.3" marker-end="url(#a)"/>

  <!-- ON-CHAIN band -->
  <text x="48" y="372" font-size="11" font-weight="700" fill="#c0392b" letter-spacing="0.05em">ON-CHAIN — Avalanche C-Chain (Fuji testnet / local node)</text>
  <rect x="48" y="398" width="200" height="86" rx="8" fill="#fbe9e7" stroke="#c0392b" stroke-width="1.5"/>
  <text x="148" y="422" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a1d24">IdentityRegistry</text>
  <text x="148" y="440" text-anchor="middle" font-size="9.5" fill="#5a6472">verified · accredited ·</text>
  <text x="148" y="453" text-anchor="middle" font-size="9.5" fill="#5a6472">jurisdiction · frozen</text>
  <text x="148" y="472" text-anchor="middle" font-size="9.5" fill="#c0392b">KYC / KYB claims</text>

  <rect x="260" y="398" width="200" height="86" rx="8" fill="#fbe9e7" stroke="#c0392b" stroke-width="1.5"/>
  <text x="360" y="422" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a1d24">ComplianceRegistry</text>
  <text x="360" y="440" text-anchor="middle" font-size="9.5" fill="#5a6472">Reg D (accredited) /</text>
  <text x="360" y="453" text-anchor="middle" font-size="9.5" fill="#5a6472">Reg S (non-US) gate</text>
  <text x="360" y="472" text-anchor="middle" font-size="9.5" fill="#c0392b">typed-revert gauntlet</text>

  <rect x="472" y="398" width="240" height="86" rx="8" fill="#fbe9e7" stroke="#c0392b" stroke-width="2.5"/>
  <text x="592" y="422" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d24">CreditToken (ERC-3643-lite)</text>
  <text x="592" y="441" text-anchor="middle" font-size="9.5" fill="#5a6472">permissioned transfer via _update hook</text>
  <text x="592" y="455" text-anchor="middle" font-size="9.5" fill="#5a6472">per-holder accrual · claim() (CEI)</text>
  <text x="592" y="472" text-anchor="middle" font-size="9.5" fill="#c0392b">the senior loan participation, tokenized</text>

  <rect x="724" y="398" width="182" height="86" rx="8" fill="#fff5ea" stroke="#b06a00" stroke-width="1.5"/>
  <text x="815" y="426" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a1d24">Reserve (USDC)</text>
  <text x="815" y="446" text-anchor="middle" font-size="9.5" fill="#5a6472">cash leg interest</text>
  <text x="815" y="459" text-anchor="middle" font-size="9.5" fill="#5a6472">claims pay from</text>

  <!-- platform -> investors coupon -->
  <line x1="906" y1="280" x2="938" y2="280" stroke="#2563eb" stroke-width="0"/>

  <!-- ============ footer legend ============ -->
  <text x="32" y="536" font-size="11.5" fill="#1a1d24"><tspan font-weight="700">Read it as a sentence:</tspan> the servicer reports cash and marks → the engine proves the books agree → the permissioned token accrues and pays eligible investors in USDC → and the whole thing halts the instant the two ledgers diverge.</text>

  <g font-size="10.5" fill="#5a6472">
    <rect x="32" y="556" width="13" height="11" rx="2" fill="#fdecec" stroke="#d23b3b"/><text x="50" y="565">borrower</text>
    <rect x="120" y="556" width="13" height="11" rx="2" fill="#eef6f2" stroke="#1f7a5a"/><text x="138" y="565">originator / off-chain</text>
    <rect x="290" y="556" width="13" height="11" rx="2" fill="#fbe9e7" stroke="#c0392b"/><text x="308" y="565">on-chain (ground truth)</text>
    <rect x="470" y="556" width="13" height="11" rx="2" fill="#f1ecfd" stroke="#6d28d9"/><text x="488" y="565">reconciliation engine</text>
    <rect x="640" y="556" width="13" height="11" rx="2" fill="#eef4ff" stroke="#2563eb"/><text x="658" y="565">investors</text>
    <rect x="730" y="556" width="13" height="11" rx="2" fill="#fff5ea" stroke="#b06a00"/><text x="748" y="565">money / USDC</text>
  </g>
</svg>
