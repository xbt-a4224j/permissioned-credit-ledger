<svg viewBox="0 0 960 660" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 Z" fill="#222"/></marker>
    <marker id="ao" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 Z" fill="#d2691e"/></marker>
  </defs>
  <text x="32" y="40" font-size="20" font-weight="700" fill="#1a1d24">off-chain ↔ on-chain reconciliation — the seam</text>
  <text x="32" y="60" font-size="12.5" fill="#5a6472">The core: servicing cash + NAV (off-chain truth) vs on-chain claimable + supply, folded by a deterministic replay into one stateHash, gated by 4 invariants. Match or HALT.</text>

  <!-- LEFT: off-chain ground truth -->
  <text x="32" y="100" font-size="11" font-weight="700" fill="#c0392b" letter-spacing="0.08em">OFF-CHAIN GROUND TRUTH</text>
  <g>
    <rect x="32" y="112" width="240" height="68" rx="8" fill="#fbe9e7" stroke="#c0392b" stroke-width="2"/>
    <text x="152" y="138" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" font-size="12.5" font-weight="600" fill="#1a1d24">servicing cash collected</text>
    <text x="152" y="157" text-anchor="middle" font-size="10" fill="#5a6472">what the servicer actually</text>
    <text x="152" y="171" text-anchor="middle" font-size="10" fill="#5a6472">collected from the borrower</text>
  </g>
  <g>
    <rect x="32" y="196" width="240" height="68" rx="8" fill="#fbe9e7" stroke="#c0392b" stroke-width="2"/>
    <text x="152" y="222" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" font-size="12.5" font-weight="600" fill="#1a1d24">NAV / mark feed</text>
    <text x="152" y="241" text-anchor="middle" font-size="10" fill="#5a6472">latest loan marks; each must</text>
    <text x="152" y="255" text-anchor="middle" font-size="10" fill="#5a6472">clear the acceptance bound</text>
  </g>

  <!-- RIGHT: on-chain ground truth -->
  <text x="688" y="100" font-size="11" font-weight="700" fill="#c0392b" letter-spacing="0.08em" text-anchor="end" transform="translate(240,0)">ON-CHAIN GROUND TRUTH</text>
  <g>
    <rect x="688" y="112" width="240" height="68" rx="8" fill="#fbe9e7" stroke="#c0392b" stroke-width="2"/>
    <text x="808" y="138" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" font-size="12.5" font-weight="600" fill="#1a1d24">on-chain claimable</text>
    <text x="808" y="157" text-anchor="middle" font-size="10" fill="#5a6472">aggregate per-holder</text>
    <text x="808" y="171" text-anchor="middle" font-size="10" fill="#5a6472">accrued, withdrawable now</text>
  </g>
  <g>
    <rect x="688" y="196" width="240" height="68" rx="8" fill="#fbe9e7" stroke="#c0392b" stroke-width="2"/>
    <text x="808" y="222" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" font-size="12.5" font-weight="600" fill="#1a1d24">total supply + identities</text>
    <text x="808" y="241" text-anchor="middle" font-size="10" fill="#5a6472">token outstanding; each</text>
    <text x="808" y="255" text-anchor="middle" font-size="10" fill="#5a6472">holder verified</text>
  </g>

  <!-- CENTER: replay engine -->
  <g>
    <rect x="312" y="300" width="336" height="116" rx="12" fill="#f1ecfd" stroke="#6d28d9" stroke-width="3"/>
    <text x="480" y="328" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" font-size="14" font-weight="700" fill="#1a1d24">reconciliation engine  ★</text>
    <text x="480" y="349" text-anchor="middle" font-size="10.5" fill="#5a6472">deterministic replay of ordered (chainEvents + nav)</text>
    <text x="480" y="365" text-anchor="middle" font-size="10.5" fill="#5a6472">canonical order = (blockNumber, logIndex)</text>
    <text x="480" y="386" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" font-size="11.5" font-weight="700" fill="#6d28d9">→ stateHash (interleaving-independent)</text>
    <text x="480" y="404" text-anchor="middle" font-size="10" fill="#5a6472">NAV validation gate re-checks every mark</text>
  </g>
  <!-- inputs into engine -->
  <line x1="272" y1="146" x2="320" y2="312" stroke="#d2691e" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ao)"/>
  <line x1="272" y1="230" x2="318" y2="332" stroke="#d2691e" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ao)"/>
  <text x="250" y="290" text-anchor="middle" font-size="10" fill="#d2691e">indexed via viem → Postgres</text>
  <line x1="688" y1="146" x2="640" y2="312" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="688" y1="230" x2="642" y2="332" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="712" y="290" text-anchor="middle" font-size="10" fill="#5a6472">read on-chain state</text>

  <!-- INVARIANTS row -->
  <text x="32" y="452" font-size="11" font-weight="700" fill="#6d28d9" letter-spacing="0.08em">4 RECONCILIATION INVARIANTS (fixed order; first failure decides the verdict)</text>
  <g font-size="9.5" fill="#5a6472">
    <rect x="32"  y="464" width="216" height="56" rx="8" fill="#f1ecfd" stroke="#6d28d9" stroke-width="1.5"/>
    <text x="140" y="484" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" font-size="10.5" font-weight="700" fill="#1a1d24">I1 · SupplyBacked</text>
    <text x="140" y="500" text-anchor="middle">supply == backed principal</text>
    <text x="140" y="513" text-anchor="middle">→ ReconMismatch</text>

    <rect x="256" y="464" width="216" height="56" rx="8" fill="#f1ecfd" stroke="#6d28d9" stroke-width="1.5"/>
    <text x="364" y="484" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" font-size="10.5" font-weight="700" fill="#1a1d24">I2 · ClaimableCovered</text>
    <text x="364" y="500" text-anchor="middle">claimable &lt;= cash collected</text>
    <text x="364" y="513" text-anchor="middle">row 10 → ReconMismatch</text>

    <rect x="480" y="464" width="216" height="56" rx="8" fill="#f1ecfd" stroke="#6d28d9" stroke-width="1.5"/>
    <text x="588" y="484" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" font-size="10.5" font-weight="700" fill="#1a1d24">I3 · NavInBounds</text>
    <text x="588" y="500" text-anchor="middle">no loan NAV out of bounds</text>
    <text x="588" y="513" text-anchor="middle">row 9 → NavAnomaly</text>

    <rect x="704" y="464" width="224" height="56" rx="8" fill="#f1ecfd" stroke="#6d28d9" stroke-width="1.5"/>
    <text x="816" y="484" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" font-size="10.5" font-weight="700" fill="#1a1d24">I4 · IdentityValid</text>
    <text x="816" y="500" text-anchor="middle">every holder verified</text>
    <text x="816" y="513" text-anchor="middle">→ ReconMismatch</text>
  </g>
  <line x1="480" y1="416" x2="480" y2="464" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- VERDICT -->
  <g>
    <rect x="248" y="552" width="200" height="60" rx="10" fill="#ecf7ef" stroke="#15803d" stroke-width="2.5"/>
    <text x="348" y="578" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" font-size="13" font-weight="700" fill="#1a1d24">OK</text>
    <text x="348" y="598" text-anchor="middle" font-size="10" fill="#5a6472">books agree → distribution allowed</text>
  </g>
  <g>
    <rect x="512" y="552" width="200" height="60" rx="10" fill="#fbe9e7" stroke="#c0392b" stroke-width="2.5"/>
    <text x="612" y="578" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" font-size="13" font-weight="700" fill="#c0392b">HALT</text>
    <text x="612" y="598" text-anchor="middle" font-size="10" fill="#5a6472">NavAnomaly / ReconMismatch → claim blocked</text>
  </g>
  <line x1="400" y1="520" x2="360" y2="552" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="560" y1="520" x2="600" y2="552" stroke="#d2691e" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ao)"/>
  <text x="640" y="540" font-size="10" fill="#d2691e">→ SSE → HALT banner in UI</text>

  <!-- legend -->
  <g transform="translate(32,636)" font-size="10.5" fill="#5a6472">
    <rect x="0" y="-9" width="13" height="11" rx="2" fill="#fbe9e7" stroke="#c0392b"/><text x="18" y="0">ground truth (off/on-chain)</text>
    <rect x="190" y="-9" width="13" height="11" rx="2" fill="#f1ecfd" stroke="#6d28d9"/><text x="208" y="0">engine / invariant</text>
    <rect x="330" y="-9" width="13" height="11" rx="2" fill="#ecf7ef" stroke="#15803d"/><text x="348" y="0">OK / allowed</text>
    <line x1="440" y1="-4" x2="466" y2="-4" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/><text x="472" y="0">read/flow</text>
    <line x1="560" y1="-4" x2="586" y2="-4" stroke="#d2691e" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ao)"/><text x="592" y="0">event/halt</text>
  </g>
</svg>
