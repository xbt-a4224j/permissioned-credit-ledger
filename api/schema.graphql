scalar Address

scalar BigIntStr

type BookAnalytics {
  avgCouponBps: Float!
  avgDscrBps: Float!
  avgLtvBps: Float!
  byOriginator: [BookBucket!]!
  byPropertyType: [BookBucket!]!
  byState: [BookBucket!]!
  exposureByType: [BookBucket!]!
  ltvDistribution: [BookBucket!]!
  scoreDistribution: [BookBucket!]!
  tokenized: Int!
  tokenizedPrincipalM: Int!
  total: Int!
  totalPrincipalM: Int!
}

type BookBucket {
  count: Int!
  label: String!
}

type BookLoan {
  couponBps: Int!
  creditScore: Float!
  dscrBps: Int!
  durationScore: Float!
  loanId: ID!
  ltvBps: Int!
  originator: String!
  portfolioScore: Float!
  principal: Float!
  propertyType: String!
  returnScore: Float!
  score: Float!
  state: String!
  termMonths: Int!
  tokenized: Boolean!
}

type ChainEvent {
  blockNumber: Int!
  id: ID!
  ingestedAt: DateTime!
  logIndex: Int!
  name: String!
  summary: String!
}

input ClaimInput {
  loanId: ID!
  wallet: Address!
}

scalar DateTime

type Identity {
  verified: Boolean!
  wallet: Address!
}

type InvariantResult {
  delta: BigIntStr
  name: String!
  offchain: BigIntStr
  ok: Boolean!
  onchain: BigIntStr
}

input InvestInput {
  amount: BigIntStr!
  loanId: ID!
  wallet: Address!
}

input KycInput {
  docFilename: String!
  docSha256: String!
  docSize: Int!
  fullName: String!
  wallet: Address!
}

type KycResult {
  claims: KycStatus
  decision: String!
  reason: String
  txHash: String
}

type KycStatus {
  verified: Boolean!
}

type Loan {
  dataRoomUri: String
  dscrBps: Int!
  id: ID!
  ltvBps: Int!
  principal: BigIntStr!
  ratePerSecond: BigIntStr!
  status: LoanStatus!
  subscribed: BigIntStr!
}

enum LoanStatus {
  Active
  Frozen
  Matured
}

type Mutation {
  claim(input: ClaimInput!): TxReceiptRef!
  invest(input: InvestInput!): TxReceiptRef!
  reportCash(amount: String!, loanId: Int!): ReconciliationStatus!
  submitKyc(input: KycInput!): KycResult!
  submitNav(loanId: Int!, navBps: Int!): ReconciliationStatus!
  tokenizeLoan(warehouseLoanId: String!): TokenizeResult!
  transfer(input: TransferInput!): TxReceiptRef!
}

type NavReading {
  accepted: Boolean!
  id: ID!
  loanId: String!
  navBps: Int!
  observedAt: DateTime!
  rejectReason: String
  source: String!
}

type Position {
  accrued: BigIntStr!
  claimable: BigIntStr!
  holder: Address!
  id: ID!
  lastAccrualAt: DateTime!
  loanId: ID!
  principal: BigIntStr!
}

type Query {
  book(includeTokenized: Boolean = false, limit: Int = 50, offset: Int = 0): RankedBook!
  bookAnalytics: BookAnalytics!
  chainEvents(limit: Int = 20): [ChainEvent!]!
  currentBlock: Int!
  kycStatus(wallet: Address!): KycStatus!
  loan(id: ID!): Loan
  loans: [Loan!]!
  navReadings(loanId: ID!): [NavReading!]!
  position(holder: Address!, loanId: ID!): Position
  positions(holder: Address!): [Position!]!
  reconciliationStatus: ReconciliationStatus!
  reserve: ReserveState!
  reserveLedger(limit: Int = 20): [ReserveLedgerEntry!]!
  txStatus(hash: String!): TxReceiptRef
}

type RankedBook {
  loans: [BookLoan!]!
  total: Int!
  weights: ScoreWeights!
}

"""
The 3 on-chain custom errors + 2 off-chain engine HALT states, as one typed code.
"""
enum ReasonCode {
  ExceedsPrincipal
  InsufficientReserve
  NavAnomaly
  ReceiverNotVerified
  ReconMismatch
}

enum ReconState {
  HALTED
  OK
}

type ReconciliationStatus {
  checkedAt: DateTime!
  cycle: Int!
  haltReason: ReasonCode
  invariants: [InvariantResult!]!
  state: ReconState!
}

type ReserveLedgerEntry {
  amount: BigIntStr!
  at: DateTime!
  balanceAfter: BigIntStr
  entryType: String!
  id: ID!
  loanId: ID
  reason: String!
}

type ReserveState {
  balance: BigIntStr!
  totalClaimable: BigIntStr!
}

type ScoreWeights {
  credit: Float!
  duration: Float!
  portfolio: Float!
  ret: Float!
}

type TokenizeResult {
  loanId: ID!
  tokenAddress: String!
  txHash: String!
}

input TransferInput {
  amount: BigIntStr!
  from: Address!
  loanId: ID!
  to: Address!
}

type TxReceiptRef {
  blockNumber: BigIntStr
  hash: String!
  reasonCode: ReasonCode
  state: TxState!
}

enum TxState {
  CONFIRMED
  PENDING
  REVERTED
}
